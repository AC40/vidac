[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidac"
version = "0.1.0"
description = "A local workspace for footage, selects, and AI-assisted rough cuts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "opentimelineio>=0.17,<1",
  "python-multipart>=0.0.18,<1",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vidac = "vidac.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/src/vidac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: tests that run FFmpeg on real media"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
